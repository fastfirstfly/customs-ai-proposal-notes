<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">輸入許可10万件当たりの知的財産侵害品輸入差止件数</title>
  <desc id="desc">参考値は2019年の51.6件から2025年の14.0件まで毎年低下し、端点比較で72.9パーセント減少した。</desc>
  <rect width="1200" height="675" fill="#ffffff"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Yu Gothic', 'Hiragino Sans', sans-serif">
    <text x="72" y="72" font-size="32" font-weight="700" fill="#172033">輸入規模当たりの知財侵害品差止件数は低下</text>
    <text x="72" y="112" font-size="19" fill="#526070">輸入許可10万件当たりの知的財産侵害品輸入差止件数（参考値）</text>

    <rect x="928" y="48" width="200" height="72" rx="12" fill="#fff2e7"/>
    <text x="1028" y="79" text-anchor="middle" font-size="17" font-weight="600" fill="#9a3f00">2019 → 2025</text>
    <text x="1028" y="106" text-anchor="middle" font-size="25" font-weight="700" fill="#d45a00">−72.9%</text>

    <!-- chart frame and horizontal grid -->
    <rect x="120" y="180" width="960" height="320" fill="#fbfcfe" stroke="#d8dee8" stroke-width="1"/>
    <g stroke="#e2e7ef" stroke-width="1">
      <line x1="120" y1="500" x2="1080" y2="500"/>
      <line x1="120" y1="420" x2="1080" y2="420"/>
      <line x1="120" y1="340" x2="1080" y2="340"/>
      <line x1="120" y1="260" x2="1080" y2="260"/>
      <line x1="120" y1="180" x2="1080" y2="180"/>
    </g>

    <!-- y axis -->
    <g font-size="15" fill="#657286" text-anchor="end">
      <text x="102" y="505">0</text>
      <text x="102" y="425">15</text>
      <text x="102" y="345">30</text>
      <text x="102" y="265">45</text>
      <text x="102" y="185">60</text>
    </g>
    <text x="26" y="340" transform="rotate(-90 26 340)" font-size="15" fill="#657286" text-anchor="middle">件／輸入許可10万件</text>

    <!-- trend line -->
    <path d="M150 224.8 L300 268.0 L450 342.1 L600 372.7 L750 379.5 L900 407.2 L1050 425.3"
          fill="none" stroke="#2463b4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- observations -->
    <g fill="#ffffff" stroke="#2463b4" stroke-width="4">
      <circle cx="150" cy="224.8" r="8"/>
      <circle cx="300" cy="268.0" r="8"/>
      <circle cx="450" cy="342.1" r="8"/>
      <circle cx="600" cy="372.7" r="8"/>
      <circle cx="750" cy="379.5" r="8"/>
      <circle cx="900" cy="407.2" r="8"/>
      <circle cx="1050" cy="425.3" r="8"/>
    </g>

    <!-- values -->
    <g font-size="16" font-weight="600" fill="#26354a" text-anchor="middle">
      <text x="150" y="204">51.6</text>
      <text x="300" y="247">43.5</text>
      <text x="450" y="321">29.6</text>
      <text x="600" y="352">23.9</text>
      <text x="750" y="359">22.6</text>
      <text x="900" y="387">17.4</text>
      <text x="1050" y="405">14.0</text>
    </g>

    <!-- x axis -->
    <g font-size="16" fill="#526070" text-anchor="middle">
      <text x="150" y="531">2019</text>
      <text x="300" y="531">2020</text>
      <text x="450" y="531">2021</text>
      <text x="600" y="531">2022</text>
      <text x="750" y="531">2023</text>
      <text x="900" y="531">2024</text>
      <text x="1050" y="531">2025</text>
    </g>
    <text x="600" y="562" font-size="15" fill="#657286" text-anchor="middle">暦年</text>

    <!-- endpoint context -->
    <text x="72" y="603" font-size="17" font-weight="600" fill="#172033">同期間の変化：</text>
    <text x="222" y="603" font-size="17" fill="#26354a">輸入許可件数 4,640万件 → 2億2,680万件（約4.89倍）</text>
    <text x="735" y="603" font-size="17" fill="#26354a">差止件数 23,934件 → 31,760件（+32.7%）</text>

    <text x="72" y="630" font-size="13" fill="#6b7585">注：輸入許可件数と差止件数は統計上の対象範囲が完全には一致しないため、「発見率」ではなく規模感を比較する参考指標。</text>
    <text x="1128" y="655" font-size="12" fill="#6b7585" text-anchor="end">出典：税関パンフレット2026、財務省「令和7年の知財侵害物品の差止状況」</text>
  </g>
</svg>
